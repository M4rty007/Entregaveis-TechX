<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays, DOM e Eventos</title>
  <script src="app.js" defer></script>
</head>
<body>
  <h1 id="titulo">Desafios de JavaScript</h1>

  <p class="texto">Este é o primeiro parágrafo.</p>
  <p class="texto">Este é o segundo parágrafo.</p>

  <h2>Lista</h2>
  <ul id="lista">
    <li>Item inicial 1</li>
    <li>Item inicial 2</li>
    <li>Item inicial 3</li>
  </ul>

  <button id="botao" type="button">Clique ou passe o mouse</button>

  <div>
    <label for="nome">Digite seu nome:</label>
    <input id="nome" type="text">
  </div>

  <form id="formulario">
    <label for="tarefa">Nova tarefa:</label>
    <input id="tarefa" type="text">
    <button type="submit">Adicionar tarefa</button>
  </form>
</body>
</html>
