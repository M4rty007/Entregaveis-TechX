<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de CEP e Mini Pokédex</title>
  <script src="app.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 2rem auto;
      max-width: 800px;
      padding: 0 1rem;
    }

    section {
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 1.5rem 0;
      padding: 1rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    input,
    button {
      font: inherit;
      padding: 0.5rem;
    }

    button {
      cursor: pointer;
    }

    [aria-live] {
      min-height: 1.5em;
    }

    img {
      display: block;
      image-rendering: pixelated;
      height: 120px;
      width: 120px;
    }
  </style>
</head>
<body>
  <h1>Buscador de CEP e Mini Pokédex</h1>

  <main>
    <section aria-labelledby="titulo-cep">
      <h2 id="titulo-cep">Buscador de CEP</h2>

      <form id="formulario-cep">
        <label for="campo-cep">CEP:</label>
        <input
          id="campo-cep"
          name="cep"
          type="text"
          inputmode="numeric"
          autocomplete="postal-code"
          placeholder="Ex.: 01001000"
        >
        <button id="botao-cep" type="submit">Buscar CEP</button>
      </form>

      <p id="status-cep" aria-live="polite"></p>
      <dl id="resultado-cep"></dl>

      <h3>Histórico de buscas</h3>
      <ul id="historico-ceps"></ul>
    </section>

    <section aria-labelledby="titulo-pokemon">
      <h2 id="titulo-pokemon">Mini Pokédex</h2>

      <form id="formulario-pokemon">
        <label for="campo-pokemon">Nome do Pokémon:</label>
        <input
          id="campo-pokemon"
          name="pokemon"
          type="text"
          placeholder="Ex.: pikachu"
        >
        <button id="botao-pokemon" type="submit">Buscar Pokémon</button>
      </form>

      <p id="status-pokemon" aria-live="polite"></p>
      <div id="resultado-pokemon"></div>
    </section>
  </main>
</body>
</html>
